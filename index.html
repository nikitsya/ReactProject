<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Goals</title>
        <link rel="icon" type="image/png" href="img/icon.png">

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/styles.css"/>

        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <script src="https://unpkg.com/prop-types@15.6/prop-types.js"></script>

        <!-- My script-->
        <script src="jsx/main-script.jsx" type="text/babel"></script>

        <!-- My style compiled from scss file -->
        <link rel="stylesheet" href="css/my_style.css">
    </head>

    <!-- Template: SB Admin by Start Bootstrap
         Source: https://startbootstrap.com/template/sb-admin
         Package: startbootstrap-sb-admin-gh-pages.zip -->
    <body class="sb-nav-fixed sb-sidenav-toggled">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <a id="nav_info" class="navbar-brand ps-3"></a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <div id="add_row" class="d-none d-md-inline-block"></div>
            <div id="tags_manager" class="d-none d-md-inline-block"></div>
            <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
                <div id="search"></div>
            </form>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Navigation</div>

                            <a class="nav-link" href="#table-section">
                                <div class="sb-nav-link-icon"><i class="fas fa-table"></i></div>
                                Table
                            </a>

                            <a class="nav-link" href="#filter-section">
                                <div class="sb-nav-link-icon"><i class="fas fa-filter"></i></div>
                                Filter
                            </a>

                            <a class="nav-link" href="#search-section">
                                <div class="sb-nav-link-icon"><i class="fas fa-search"></i></div>
                                Search
                            </a>

                            <button class="nav-link btn-link text-start" id="openAddRow">
                                <div class="sb-nav-link-icon"><i class="fas fa-plus-circle"></i></div>
                                Add Row
                            </button>

                            <button class="nav-link btn-link text-start" id="openTagsManager">
                                <div class="sb-nav-link-icon"><i class="fas fa-tags"></i></div>
                                Tags Manager
                            </button>
                        </div>
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <div id="goal_info"></div>
                        <!-- FILTER -->
                        <div class="card mb-4" id="filter-section">
                            <div class="card-header">
                                <i class="fas fa-filter me-1"></i> Filter
                            </div>
                            <div class="card-body">
                                <div id="filter"></div>
                            </div>
                        </div>
                        <!-- TABLE -->
                        <div class="card mb-4" id="table-section">
                            <div class="card-header">
                                <i class="fas fa-table me-1"></i> Table
                            </div>
                            <div class="card-body">
                                <div id="table-container"></div>
                            </div>
                        </div>
                        <!-- SEARCH -->
                        <div class="card mb-4" id="search-section">
                            <div class="card-header">
                                <i class="fas fa-search me-1"></i> Search
                            </div>
                            <div class="card-body">
                                <div id="search_"></div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <footer id="footer"></footer>

        <script src="js/scripts.js"></script>
        <script type="text/babel">ReactDOM.render(<DataForm/>, document.getElementById("table-container"))</script>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                document.querySelectorAll('.sb-sidenav a[href^="#"]').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault()
                        const target = document.querySelector(this.getAttribute('href'))
                        if (target) {
                            target.scrollIntoView({ behavior: "smooth", block: "start" })
                        }
                    })
                })

                const addRowButton = document.getElementById("openAddRow")
                addRowButton.addEventListener("click", function() {
                    const addBtn = document.querySelector("#add_row button")
                    if (addBtn) addBtn.click()
                })

                const tagsButton = document.getElementById("openTagsManager")
                tagsButton.addEventListener("click", function() {
                    const tagBtn = document.querySelector("#tags_manager button")
                    if (tagBtn) tagBtn.click()
                })
            })
        </script>

    </body>
</html>
